name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","linux","ARM64","tduic-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject (python = "^3.9")
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements.txt
      - name: Compile
        run: python -m compileall -q src tests scripts demo.py
      - name: Test
        run: python -m pytest --timeout=120
