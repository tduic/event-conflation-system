[tool.poetry]
name = "event-conflation"
version = "0.1.0"
description = "Cloud-native event conflation system with asyncio and timer-based aggregation"
authors = ["Tyler Duic"]
readme = "README.md"
packages = [{include = "event_conflation", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
pydantic = "^2.0.0"
pyyaml = "^6.0"
aiofiles = "^23.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-timeout = "^2.1.0"
black = "^23.0"
isort = "^5.12"
mypy = "^1.5"

[tool.poetry.scripts]
event-conflation = "event_conflation.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/event_conflation --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
