conflation:
  idle_interval: 2  # 2 seconds for quick test
  max_buffer_size: 10000

state:
  backend: "memory"
  checkpoint_interval: 60
  file:
    state_path: "./data/state.json"
    checkpoint_path: "./data/checkpoints/"

output:
  writer: "json"
  file_path: "./data/test_output.json"
  enable_batching: false
  batch_size: 100

error_handling:
  max_clock_skew: 300
  dlq_path: "./data/dlq.json"

logging:
  level: "INFO"
  format: "text"
